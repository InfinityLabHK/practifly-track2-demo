<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="賽道二數學建模體驗版:熱身(全班投影)、個人挑戰、小組挑戰、一分鐘匯報模板;繁 / 简 / EN;不用帳號,作答不上傳。"><title>賽道二數學建模體驗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="gf" media="print" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+HK:wght@500;700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>body{margin:0}</style></head><body><style>
/* 灣區時光列車號 · 賽道二體驗 v2.0
   版面:深紫星空外框(兩個主題都係夜空)+ 霓虹車窗(.win:亮 = 白晝站台,暗 = 窗內轉夜)+ 8 站列車進度軌 */
:root{
 --sky1:#0B0D33;--sky2:#1A0F55;--onsky:#F3EEFF;--onsky2:#B9AEE6;--neon:#B06CFF;--cyan:#5FE8F5;--mint:#7FC8A0;
 --win:linear-gradient(180deg,#EFEAFB 0%,#F7F5FA 34%,#FFFFFF 100%);--winsolid:#FDFCFF;
 --card:#FFFFFF;--card2:#F6F2FD;--card3:#F1EDF6;--ink:#1F1A2B;--ink2:#56496A;--ink3:#6B5F80;--line:#E5DEEC;
 --pf:#7954BF;--pfd:#3A1C86;--pfsoft:#F0EAF8;--onpf:#FFFFFF;
 --ok:#17784F;--oksoft:#E5F6EE;--no:#C93E31;--nosoft:#FDEBE8;--warn:#B85F0C;--warnsoft:#FFF4E5;--gold:#E3A800;--goldsoft:#FFF8DB;
 --q:#7954BF;--d:#2A6FC0;--c:#C53A2E;--k:#A85F0E;--p:#C0469B;--x:#6B717F;
 --c1:#F2994A;--c2:#9A7CF0;--c3:#4FA8E8;--c4:#3FCB98;--c5:#F07AA0;
 --coach:linear-gradient(150deg,#2A0E66,#46068D 55%,#7954BF);--oncoach:#FFFFFF;
 --shadow:0 4px 18px rgba(48,42,61,.08);
 --f-body:"Noto Sans HK","PingFang HK","PingFang TC","Microsoft JhengHei",sans-serif;
 --f-num:"Inter","Noto Sans HK","PingFang HK",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --win:radial-gradient(80% 55% at 50% 0%,#2A1670 0%,#170F4C 55%,#0E0A33 100%);--winsolid:#0F0B36;
 --card:#1D1656;--card2:#251C66;--card3:#2C2272;--ink:#F6F3FF;--ink2:#D2CBF3;--ink3:#A39AD3;--line:rgba(176,140,255,.32);
 --pf:#C6A8FF;--pfd:#E9DDFF;--pfsoft:rgba(176,108,255,.2);--onpf:#170C42;
 --ok:#55D6A2;--oksoft:rgba(63,191,143,.17);--no:#FF8E84;--nosoft:rgba(224,123,115,.17);--warn:#FFB45C;--warnsoft:rgba(255,180,92,.14);--gold:#FFD24A;--goldsoft:rgba(255,210,74,.13);
 --q:#B79BFF;--d:#70B4FF;--c:#FF7D72;--k:#FFB04A;--p:#F27CCB;--x:#A6ACBC;
 --shadow:0 4px 22px rgba(0,0,0,.38);color-scheme:dark}}
:root[data-theme="dark"]{
 --win:radial-gradient(80% 55% at 50% 0%,#2A1670 0%,#170F4C 55%,#0E0A33 100%);--winsolid:#0F0B36;
 --card:#1D1656;--card2:#251C66;--card3:#2C2272;--ink:#F6F3FF;--ink2:#D2CBF3;--ink3:#A39AD3;--line:rgba(176,140,255,.32);
 --pf:#C6A8FF;--pfd:#E9DDFF;--pfsoft:rgba(176,108,255,.2);--onpf:#170C42;
 --ok:#55D6A2;--oksoft:rgba(63,191,143,.17);--no:#FF8E84;--nosoft:rgba(224,123,115,.17);--warn:#FFB45C;--warnsoft:rgba(255,180,92,.14);--gold:#FFD24A;--goldsoft:rgba(255,210,74,.13);
 --q:#B79BFF;--d:#70B4FF;--c:#FF7D72;--k:#FFB04A;--p:#F27CCB;--x:#A6ACBC;
 --shadow:0 4px 22px rgba(0,0,0,.38);color-scheme:dark}
:root[lang^="zh-Hans"]{--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--f-num:"Inter","Noto Sans SC","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--sky1);color:var(--ink);font:500 17px/1.6 var(--f-body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky1)}
button,textarea,input{font-family:inherit}
button{cursor:pointer;touch-action:manipulation;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
.sky svg{width:100%;height:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto;position:relative}
/* 頂欄 */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,13,51,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(176,108,255,.35);padding-block:9px}
.bar .in{display:flex;align-items:center;gap:12px}
.bar .pfm{width:38px;height:28px;flex:none}
.bar .tt{flex:1;min-width:0;color:var(--onsky)}
.bar .tt small{display:block;font:800 11.5px/1.3 var(--f-num);letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tt b{display:block;font:900 17px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tt span{display:block;font:700 12.5px/1.35 var(--f-body);color:var(--onsky2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homeb{border:1.5px solid rgba(255,255,255,.35);background:none;color:var(--onsky);border-radius:12px;padding:7px 12px;font:800 14px/1.2 var(--f-body);flex:none;min-height:44px}
.lang{display:flex;flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:3px;gap:2px}
.lang button{border:0;background:none;color:var(--onsky2);border-radius:9px;padding:6px 9px;font:900 14px/1 var(--f-body);min-width:44px;min-height:44px}
.lang button[aria-pressed="true"]{background:var(--cyan);color:#0B0D33}
.thm{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--onsky);display:grid;place-items:center}
.thm svg{width:19px;height:19px}
/* 8 站列車軌 */
.railw{position:relative;z-index:2;padding-block:12px 4px}
.rail{position:relative;padding-top:40px}
.stops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));position:relative}
.stops::before{content:"";position:absolute;left:6.25%;right:6.25%;top:11px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(185,174,230,.5) 0 3px,transparent 3px 11px),linear-gradient(rgba(185,174,230,.55),rgba(185,174,230,.55)) top/100% 2px no-repeat,linear-gradient(rgba(185,174,230,.55),rgba(185,174,230,.55)) bottom/100% 2px no-repeat}
.rfill{position:absolute;left:6.25%;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cyan),#B06CFF 60%,#F07AC8);box-shadow:0 0 12px rgba(95,232,245,.55);width:calc(87.5% * var(--m) / 7);transition:width .9s cubic-bezier(.5,0,.2,1)}
.st{width:100%;min-height:44px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--onsky2);position:relative;z-index:1}
.st .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 13px/1 var(--f-num);background:#251a63;border:2px solid rgba(185,174,230,.55);color:var(--onsky2)}
.st.done .dot{background:var(--cyan);border-color:var(--cyan);color:#0B0D33}
.st.on .dot{background:#fff;border-color:#fff;color:#2A0E66;box-shadow:0 0 0 5px rgba(176,108,255,.55),0 0 18px rgba(176,108,255,.9)}
.st .sn{font:800 12.5px/1.25 var(--f-body);text-align:center;max-width:100%;padding:0 2px;overflow-wrap:anywhere}
.st.on .sn{color:#fff}
.st.done .sn{color:var(--onsky)}
.st.open .dot{border-color:#fff;color:#fff}
.st:disabled{opacity:.55}
.loco{position:absolute;top:0;left:calc((var(--k) + .5) * 12.5%);transform:translateX(-50%);transition:left .9s cubic-bezier(.5,0,.2,1);z-index:2;pointer-events:none}
.loco .lb{position:relative;width:58px;height:30px;border-radius:14px 16px 6px 6px;background:linear-gradient(180deg,#9B7BF0,#6234C4);box-shadow:0 0 0 2px rgba(255,255,255,.8),0 0 14px rgba(176,108,255,.9);display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.loco .lb::before{content:"";position:absolute;left:7px;top:8px;width:14px;height:8px;border-radius:3px;background:rgba(95,232,245,.85)}
.loco .lb::after{content:"";position:absolute;left:8px;right:8px;bottom:-6px;height:10px;background:radial-gradient(circle at 6px 5px,#0B0D33 4px,#B9AEE6 4.5px 5.5px,transparent 6px) left/22px 10px repeat-x}
.loco img{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid #fff}
.loco.mv .lb{animation:chug .3s ease-in-out 3}
@keyframes chug{50%{transform:translateY(-2px)}}
/* 車窗 */
main.win{position:relative;z-index:1;margin-block:10px 18px;border-radius:26px;background:var(--win);color:var(--ink);box-shadow:0 0 0 3px var(--neon),0 0 22px 3px rgba(176,108,255,.55),0 0 0 8px rgba(95,232,245,.2);padding:22px 24px 26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.wh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qe{font:900 12.5px/1.35 var(--f-num);letter-spacing:.2em;color:var(--pf);display:flex;align-items:center;gap:8px;text-transform:uppercase;min-width:0}
.qe::before{flex:none}
.qe::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--mint)}
h1,h2,h3{text-wrap:balance}
.wh h2{margin:0;font:900 26px/1.25 var(--f-body);color:var(--ink)}
h3{margin:0;font:900 19px/1.35 var(--f-body)}
p{margin:0}
.lead{color:var(--ink2);font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 20px;font:900 17px/1.3 var(--f-body);background:var(--pf);color:var(--onpf);min-height:48px}
.btn.s{background:var(--card);color:var(--pf);border:2px solid color-mix(in srgb,var(--pf) 40%,transparent)}
.btn.w{background:var(--card);color:var(--no);border:2px solid color-mix(in srgb,var(--no) 40%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.nextbar{display:flex;gap:10px 14px;align-items:center;justify-content:flex-end;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
.nextbar .why{color:var(--ink3);font-size:14.5px;font-weight:700;flex:1;min-width:0}
.nextbar .btn[aria-disabled="true"]{opacity:.55}
/* R0 嚮導氣泡 */
.guide{display:flex;gap:12px;align-items:flex-start}
.guide img{width:52px;height:52px;border-radius:50%;flex:none;background:#fff;box-shadow:0 0 0 3px var(--cyan)}
.guide .bub{position:relative;background:var(--coach);color:var(--oncoach);border-radius:4px 18px 18px 18px;padding:11px 15px;font:700 16px/1.55 var(--f-body);box-shadow:0 0 14px rgba(176,108,255,.3);min-width:0}
.guide .bub b{color:var(--cyan);display:block;font:900 12px/1.4 var(--f-num);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.guide.warn .bub{background:linear-gradient(150deg,#7A3A07,#B85F0C)}
/* 首頁 */
.hero2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:18px;align-items:center}
.hero2 .l{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero2 h2{margin:0;font:900 34px/1.22 var(--f-body);color:var(--ink)}
.hero2 h2 em{font-style:normal;color:var(--pf);background:linear-gradient(transparent 70%,color-mix(in srgb,var(--mint) 45%,transparent) 70%)}
.hero2 .r{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.hero2 .r img{width:min(250px,100%);height:auto;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(80,40,160,.3))}
.hero2 .say{background:var(--coach);color:var(--oncoach);border-radius:18px;padding:10px 14px;font:700 14.5px/1.5 var(--f-body);max-width:280px;position:relative}
.hero2 .say::after{content:"";position:absolute;left:50%;top:-9px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#46068D}
@keyframes bob{50%{transform:translateY(-8px)}}
.lpick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lpick span{font:800 13px/1 var(--f-body);color:var(--ink3)}
.lpick button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font:900 15px/1.2 var(--f-body);color:var(--ink2);min-height:44px}
.lpick button[aria-pressed="true"]{border-color:var(--pf);background:var(--pf);color:var(--onpf)}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.four div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px;font-size:13.5px;color:var(--ink2);font-weight:700;line-height:1.45}
.four b{display:block;color:var(--pf);font-size:15px}
.t2{border:2px solid color-mix(in srgb,var(--pf) 35%,transparent)}
.t2g{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.t2g>div{min-width:0;background:var(--card2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.t2g b{color:var(--pfd);font-size:16px}
.t2g p{font-size:15px}
.t2g .fine{font-size:13px;color:var(--ink3)}
.rb{list-style:none;margin:0;padding:0;font-size:15px}
.rb li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.rb em{font:900 15px/1.5 var(--f-num);font-style:normal;color:var(--pf);font-variant-numeric:tabular-nums}
.sech{display:flex;align-items:center;gap:10px}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.qc{text-align:left;border:0;padding:0;background:var(--card);border-radius:20px;display:grid;grid-template-columns:76px minmax(0,1fr);overflow:hidden;box-shadow:var(--shadow);outline:1px solid var(--line);color:var(--ink);transition:transform .15s}
.qc:hover{transform:translateY(-2px)}
.qc .stub{background:var(--coach);color:var(--oncoach);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-right:3px dashed color-mix(in srgb,var(--winsolid) 70%,transparent);padding:12px 4px}
.qc .stub b{font:900 34px/1 var(--f-num);color:var(--cyan)}
.qc .stub small{font:800 11px/1.2 var(--f-num);letter-spacing:.12em;color:#D8CCFF;text-transform:uppercase;text-align:center}
.qc .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg i{font-style:normal;font-size:12.5px;border-radius:99px;padding:2px 9px;background:var(--pfsoft);color:var(--pf);font-weight:800}
.qc .nm{font:900 21px/1.3 var(--f-body);color:var(--ink)}
.qc .src{font-size:13px;color:var(--ink3);font-weight:700}
.qc .stt{font-size:14px;color:var(--ink3);font-weight:800}
.qc .stt.ok{color:var(--ok)}
.qc .go{align-self:flex-start;background:var(--pf);color:var(--onpf);border-radius:12px;padding:8px 14px;font-weight:900;font-size:15px;margin-top:4px}
.crew{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end}
.crew figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.crew img{width:100%;max-width:150px;height:clamp(64px,13vw,150px);object-fit:contain;filter:drop-shadow(0 8px 14px rgba(60,30,120,.22));animation:wave 2.6s ease-in-out infinite}
.crew figure:nth-child(even) img{animation-delay:.6s}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4%) rotate(-3deg)}75%{transform:translateY(-2%) rotate(3deg)}}
.crew figcaption{font:900 13.5px/1.25 var(--f-body);padding:5px 10px;border-radius:99px;color:#1F1A2B;background:var(--g)}
.crew small{font:700 12.5px/1.3 var(--f-body);color:var(--ink2)}
/* 讀題上色 */
.pens{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.pens button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 9px;text-align:left;min-height:62px;display:flex;flex-direction:column;gap:2px}
.pens button b{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--c0);line-height:1.25}
.pens button b::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c0);flex:none}
.pens button small{font-size:11.5px;color:var(--ink2);font-weight:700;line-height:1.35}
.pens button.on{border-color:var(--c0);box-shadow:0 0 0 2px var(--c0) inset;background:color-mix(in srgb,var(--c0) 10%,var(--card))}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 24px;box-shadow:var(--shadow)}
.qt{font:900 23px/2.05 var(--f-body);color:var(--ink)}
:root[lang="en"] .qt{font-size:21px;line-height:1.95;font-weight:700}
.qt span[data-i]{border-radius:6px;padding:3px 2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.qt span[data-i]:hover{background:var(--pfsoft)}
.m-q{background:color-mix(in srgb,var(--q) 14%,transparent);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--q) 85%,transparent)}
.m-d{background:color-mix(in srgb,var(--d) 16%,transparent);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--d) 80%,transparent)}
.m-c{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 80%,transparent)}
.m-k{background:color-mix(in srgb,var(--k) 18%,transparent);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--k) 85%,transparent)}
.m-p{background:color-mix(in srgb,var(--p) 15%,transparent);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--p) 80%,transparent)}
.m-x{color:var(--x);text-decoration:line-through;background:color-mix(in srgb,var(--x) 14%,transparent)}
.cnt{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink2);font-weight:700}
.cnt i{font-style:normal;border-radius:99px;padding:3px 10px;background:var(--card3);display:flex;align-items:center;gap:6px}
.cnt i::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c0)}
.cmp{display:flex;flex-direction:column;gap:4px}
.cmp div{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px 24px;gap:8px;align-items:center;font-size:15px;border-bottom:1px dashed var(--line);padding:5px 0}
.cmp div.h{font-weight:900;color:var(--ink3);font-size:13px;border:0}
.cmp em{font-style:normal;border-radius:8px;padding:2px 6px;font-size:13px;font-weight:900;text-align:center;color:var(--onpf);background:var(--c0)}
.cmp em.e{background:var(--card3);color:var(--ink3)}
.cmp b.y{color:var(--ok)}.cmp b.n{color:var(--warn)}
/* 揀最重視 */
.th{display:flex;gap:16px;align-items:center}
.th img{width:112px;height:auto;flex:none;animation:pop .5s ease-out;filter:drop-shadow(0 6px 12px rgba(60,30,120,.25))}
@keyframes pop{0%{transform:scale(.6) rotate(-8deg);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}
.th .no{font:900 14px/1 var(--f-body);color:#fff;background:var(--hc);border-radius:99px;padding:5px 11px;display:inline-block}
.th h3{font-size:23px;margin-top:6px}
.pri{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.ivc .ask{display:block;font:800 12.5px/1.3 var(--f-body);color:#7A6E8E;margin-top:8px}
.tmw{display:flex;align-items:center;gap:10px}
.ring{width:58px;height:58px;position:relative;flex:none}

.work{display:flex;flex-direction:column;gap:10px;min-width:0}

.hbtn{border:2px dashed color-mix(in srgb,var(--k) 70%,transparent);background:var(--card);color:var(--warn);border-radius:14px;padding:9px 14px;font:900 15px/1.3 var(--f-body);align-self:flex-start;min-height:44px}

/* 試改數字 */

.seg{display:flex;gap:8px}

.big{border-radius:16px;padding:14px;font:900 20px/1.35 var(--f-body);display:flex;gap:10px;align-items:center}

.tl{position:relative;height:46px;background:var(--card3);border-radius:10px;overflow:hidden}

.tlk{display:flex;gap:12px;font-size:13px;color:var(--ink2);font-weight:800;flex-wrap:wrap}

.pz{display:flex;flex-wrap:wrap;gap:6px}

.money .lim{position:absolute;top:0;bottom:0;width:3px;background:var(--no)}
/* 匯報 */
.repg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.repg .tmc{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--coach);border-radius:22px;padding:18px 20px;box-shadow:0 0 18px rgba(176,108,255,.35)}

.rep{font:900 23px/1.7 var(--f-body);padding-left:30px;margin:0}

/* 自評 */
.rate{display:flex;flex-direction:column;gap:10px}

.rate button svg{width:38px;height:38px;fill:var(--line)}
.rate button img{width:54px;height:54px;border-radius:50%;object-fit:cover;background:color-mix(in srgb,var(--hc) 22%,var(--card))}
.rate button b{display:block;font:900 17px/1.3 var(--f-body);color:var(--ink)}
.rate button small{display:block;font-size:13.5px;color:var(--ink3);font-weight:700}
.rate button small.w{color:var(--warn)}
.rate button.on{border-color:var(--gold);background:var(--goldsoft);box-shadow:0 0 0 1px var(--gold) inset}

.stars{display:flex;gap:4px}.stars svg{width:32px;height:32px;fill:var(--line)}.stars svg.on{fill:var(--gold)}
.popx{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;background:#fff;color:#1F1A2B;border:3px solid var(--hc);border-radius:22px;padding:10px 18px 10px 10px;box-shadow:0 0 26px color-mix(in srgb,var(--hc) 55%,transparent);max-width:calc(100vw - 32px);animation:popin .45s cubic-bezier(.3,1.4,.5,1)}
.popx img{width:84px;height:auto;flex:none}
.popx small{display:block;font:900 14px/1.3 var(--f-body);color:var(--hc2)}
.popx b{display:block;font:900 22px/1.3 var(--f-body)}
.popx em{font:900 24px/1 var(--f-num);font-style:normal;color:#E3A800}

.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:900;color:var(--ink2);width:70px;text-align:center;line-height:1.25}
.badge span{width:58px;height:58px;border-radius:50%;box-shadow:0 0 0 3px var(--hc);overflow:hidden;background:color-mix(in srgb,var(--hc) 22%,var(--card))}
.badge img{width:100%;height:100%;object-fit:cover}
.badge.off span{box-shadow:0 0 0 3px var(--line);filter:grayscale(1);opacity:.45}
/* 示範 */
.lock{align-items:center;text-align:center;padding:26px 16px}
.lock .sil{width:150px;height:auto;filter:brightness(0) saturate(0);opacity:.55}
.lock svg{width:44px;height:44px;color:var(--ink3)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan{border:2.5px solid var(--d);border-radius:18px;padding:12px 16px;background:var(--card);min-width:0}
.plan.b{border-color:var(--p)}
.plan small{font-size:13px;color:var(--ink3);font-weight:800}

.plan ul{margin:6px 0 0;padding-left:20px;font-size:16px}

.plan .mine{display:inline-block;margin-left:6px;font-size:12.5px;background:var(--goldsoft);color:var(--warn);border-radius:99px;padding:1px 8px;vertical-align:2px}
.trap{background:var(--nosoft);border-radius:16px;padding:12px 16px}

.trap ul{margin:4px 0 0;padding-left:20px}
.okbox{background:var(--oksoft);border-radius:16px;padding:12px 16px;font-weight:800;color:var(--ok)}

.ticket{display:grid;grid-template-columns:minmax(0,1fr) 220px;background:var(--card);border-radius:24px;box-shadow:0 0 0 2px color-mix(in srgb,var(--pf) 55%,transparent),var(--shadow);position:relative;overflow:hidden}

.route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}

.ticket h2{margin:0;font:900 24px/1.3 var(--f-body);color:var(--ink)}

.unl i{position:absolute;width:10px;height:10px;border-radius:2px;background:var(--cc);top:44%;left:50%;opacity:0}
.unl.show i{animation:burst 1.6s ease-out .5s forwards}

function ringSVG(sec,dur,on){const r=16,c=2*Math.PI*r,f=dur?Math.max(0,sec/dur):0;const col=on&&sec<=10?'var(--no)':'var(--cyan)';return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="rgba(185,174,230,.35)" stroke-width="4"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-f)).toFixed(2)}"/></svg>`}
function ringHTML(key,big,dur){return `<div class="ring ${big?'lg':''}" data-ring="${key}" data-dur="${dur||60}" role="timer" aria-live="off">${ringInner(key,dur||60)}</div>`}

const FWP={',':'，',';':'；',':':'：','!':'！','?':'？'};const CJKR=/[⺀-鿿豈-﫿＀-￯　-〿]/;
function fixPunct(root){if(!root||LANG==='en')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const A=[];let n;while((n=w.nextNode())){const pe=n.parentElement;if(pe&&pe.closest('svg,style,script,textarea,#lang,.lpick'))continue;A.push(n)}
 A.forEach((n,k)=>{const x=n.nodeValue;if(!/[,;:!?]/.test(x))return;const pv=k?A[k-1].nodeValue:'',nx=k<A.length-1?A[k+1].nodeValue:'';
 const r=x.replace(/[,;:!?]/g,(c,i,s)=>{const a=s[i-1]||pv.slice(-1),b=s[i+1]||nx.charAt(0);if(/\d/.test(a)&&/\d/.test(b))return c;return (CJKR.test(a)||CJKR.test(b))?FWP[c]:c});if(r!==x)n.nodeValue=r})}
